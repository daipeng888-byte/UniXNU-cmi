# Xiaomi Mi 10 Pro (cmi) / SM8250 — 格式 2 设备配置
#
# 本文件按 examples/device/board.toml 逐项改写，未新增模板外的键。
# 已实测值见 inputs.md；标 REQUIRED_ 的项按文档取自目标设备或原厂 DTS。
# 文档：docs/zh/porting/device-repository.md、docs/zh/reference/configuration.md

schema_version = 2

[board]
name = "cmi"
soc = "SM8250"
# 依赖 UniXNU-sm8250-common（当前不存在，需先按 SoC 支持步骤建立）
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi Mi 10 Pro (cmi) / SM8250"
kit = "cmi"
# 置 true 时 build/bootimg 会拒绝；占位符填完后保持省略或 false。

[components]
# 模板默认值；需按组件目录逐项核对 SM8250 / cmi 硬件范围后增删。
# ShengUfs 暂不选中：该版本编译 NativeUfs 时强制 -DNATIVE_VERIFIED_BLOCK=1，链接
# 需要 VerifiedRoot kit、根策略包、libBootProgress（boot-progress 尚未移植）与
# IOStorageFamily，单开 UFS 在链接阶段必然失败。详见 porting.toml 的 storage 区。
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot",
           "ShengUfs", "VirtioMmioBlock", "RamBlock", "VerifiedRoot", "ShengPreflight", "AppleKeyStoreState"]

[kernel]
defconfig = "cmi_defconfig"
# provide-storage-audit.py installs the pinned ABI record that the two
# build-virtio-mmio-bindings.py recipes read (build/storage-abi/interface-audit.json).
# build-verified-root-probe.py needs an owner-signed policy bundle and a real
# volume verification; build-boot-progress.py does not exist in the pinned
# UniXNU revision. Neither can run on a clean CI runner.
archives = ["patch-cmi-chain.py", "provide-storage-audit.py",
           "build-corecrypto-14.py", "build-corecrypto-14.py --namespace",
           "component:ArmDTPlatform", "component:ArmCpu", "component:SoftwareAES",
           "build-software-aes-bindings.py", "build-cmi-ufs.py", "component:ShengUfs",
           "component:VirtioMmioBlock", "component:RamBlock",
           "build-virtio-mmio-bindings.py --component RamBlock --directory build/ram-block",
           "build-virtio-mmio-bindings.py --component VirtioMmioBlock",
           # baseline derives the object name from the archive stem, while the
           # binder writes Native<Name>.o; provide byte-identical aliases.
           "provide-storage-object-aliases.py",
           # attempt-5: the driver compiles its explicit unverified branch
           # (gated by two boot args), so only the two link-time no-ops remain.
           "build-cmi-root-stub.py", "build-cmi-unverified-root.py",
           "build-libpthread-kernel.py", "component:AppleKeyStoreState",
           # attempt-14: publish the original display-family reference first
           # (cmi does not emit build/xnu-prelink/*-candidate.macho itself).
           "build-cmi-display-candidate.py",
           # legacy GOP display backend; must run after the driver recipes
           # because it reuses their compile records and the reference above.
           "build-gop-legacy-display.py"]
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
# 不引用 os:patches/xnu/series：该系列的第一项是 zzz-boot-progress.patch，它的
# bsd/kern/bsd_init.c 补丁块以 XNU_SHENG_PMGR（sheng 的 PMGR 电源管理补丁）为前提；
# cmi 没有那套补丁，上下文不存在，git apply 直接失败（2026-11-06 CI 实测）。
# cmi 需要的那两个 XnuPrelink 补丁写在 device:patches/xnu/series 里。
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/cmi.dts"
include_dirs = ["soc:dts"]

[firmware]
# cmiPkg 在 Platforms/Xiaomi 下，与上游 umiPkg 同级；cmi.dsc 的 INF 写成 umiPkg/...、
# FLASH_DEFINITION 写成 cmiPkg/cmi.fdf，所以 PACKAGES_PATH 必须含 {uefi}/Platforms/Xiaomi。
config = "cmi"
dsc = "Platforms/Xiaomi/cmiPkg/cmi.dsc"
fd = "Build/cmiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
# [bootimg] dtb 指向的 build/cmi/cmi.dtb 由这个 preflight 脚本用 dtc 生成
# （打包流程里没有别的东西会产出它；2026-11-06 CI 实测：pack 步骤报 device tree not found）。
preflight = ["scripts/build-cmi-dtb.py"]
# PACKAGES_PATH 必须能解析 DSC 链里引用的每个 package：
#   cmi.dsc 的 !include KonaPkg/KonaPkg.dsc.inc         -> {uefi}/Silicon/Qualcomm
#   KonaPkg.dsc.inc 的 !include QcomPkg/QcomPkg.dsc.inc -> {uefi}/Silicon/Qualcomm
#   cmiPkg/cmi.fdf 与 umiPkg/... 的 INF                 -> {uefi}/Platforms/Xiaomi
#   SiliciumPkg / SiliciumNullPkg 的 INF                -> {uefi}/Silicon/Silicium
#   UniXNUPkg（{tree}/package）、DarwinBootPkg（{tree}/drivers/DarwinBoot）
# 列法照参考设备 reAAAq/UniXNU-umi 的 [firmware] packages（它还多列 Common/Mu 两项）。
packages = [
  "{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}",
  "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium",
]

[bootimg]
# 启动镜像的固件 DTB，由固件 preflight 脚本生成（docs/porting/packaging.md）。
dtb = "build/cmi/cmi.dtb"

# 启动镜像设备树：原有 bootloader 需要固件树中没有的节点。
# 值取自设备 DT 的 /reserved-memory/cont_splash_region（0x9c000000 + 0x2300000）。
[[bootimg.dtb_node]]
path = "/reserved-memory/splash_region"
props = [
  { name = "label", type = "s", value = "cont_splash_region" },
  { name = "reg", type = "x", value = ["0x0", "0x9c000000", "0x0", "0x2300000"] },
]

[firmware.defines]
# FD_BASE / FD_SIZE / FD_BLOCKS 由 scripts/unixnu/firmware.py 从
# Resources/Configs/cmi.toml 的 [uefi_fd] 自动补，不写在这里。
# 下面四项取参考设备 umi 的同一组语义：research 固件、无 SecureBoot、开内存保护、非出货。
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
# umi 写数字 0；板名已经在 DSC 的 SMBIOS RetailModel / BoardModel 里是 cmi。
DEVICE_MODEL = "0"
BUILDID_STRING = "cmi-menu-research"

[userdata]
# cmi userdata GPT 条目，实测（HANDOVER §4）：226.18 GiB。
# 装 iOS 会整块重写这一区间；用户 2026-11-06 已明确同意清空。
# windows 与 [payload.adt] root_match_volume_uuid 留到装完系统、选定 APFS 卷后再填。
first_lba = 0x2C0000
last_lba = 0x3B4B7FA
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[payload]
volume = "CMIXNU"
# 64 MiB: kernel.macho 实测 51,892,224 B（2026-11-06 package 产物），加上 toml/trustcache
# 仍远小于 64 MiB；而 cmi 的 boot 分区只有 128 MiB，192 MiB 的负载会让 boot.img 刷不进去
# （原厂 boot.img 就是 128 MiB 整分区镜像）。
size_mib = 64
loader = "firmware"
title = "Mi 10 Pro"
# keepsyms/kt_fixed_zones 与 umi（同 SM8250）实测配置一致：panic 时保留符号，固定 zone 数。
kernel_args = ["-v", "serial=3", "keepsyms=1", "kt_fixed_zones=120",
  "sheng-pmgr=2", "native-ufs-root=1",
  # SM8250 UFS apps-SMMU stream (upstream ShengUfs defaults to sheng 0x60).
  "native-ufs-stream=0xe0", "native-ufs-smmu-takeover=1",
  # Development-only: publish the root windows without an owner policy.
  # BOTH must be set; otherwise publication still refuses.
  "native-ufs-allow-unverified=1", "root-unverified=1",
  # Load the APFS kext before the owner SystemOS mount, and keep the
  # board bring-up launch-constraint bypass used by the successful exec.
  "offline-apfs-load=1", "sheng-no-lc=1",
  # attempt-14: legacy GOP display (CPU presentation only, no GPU needed).
  "offline-mobile-graphics-load=1", "offline-legacy-pm=1",
  "offline-legacy-register=1", "offline-legacy-gop=1",
  "offline-legacy-validate=1", "offline-legacy-phase=4",
  "offline-legacy-transfer=1", "offline-legacy-retire=1"]
# 内核 panic 直接画到屏幕上（格式 2 的官方开关）；cmi 还没有面板驱动，
# 这是唯一能看到内核报错的路。与 kits/cmi/CmiKlog.c 的进度块叠加使用。
panic_screen = true
# 三 bank 求和，实测见 inputs.md 第 3 节（本机 8 GB SKU）。
# 12 GB SKU 需重新求和。
dram_size = "0x1FBB00000"

[package]
# 相对本仓库的 UniXNU checkout；scripts/package.sh 读取。
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "cmi_defconfig"

[payload.adt]
# 生成器按十六进制解析：chip = int(str(chip_id), 16)。
# 实测 qcom,msm-id = 0x164，故写作 "164"（模板示例 "207" 即 0x207）。
chip_id = "164"
unique_chip_id = "required"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
# attempt-8: DarwinBoot fills in the packed Data seed address here.
packed_data_ramdisk = true
# SM8250 的 8 个 CPU MPIDR 亲和值（umi 同 SoC 实测值，见 HANDOVER §7.8）。
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"

schema_version = 1

[device]
name = "cmi"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Mi 10 Pro (cmi), SM8250, 8 GB SKU. Host-side static checks only; no build and no device boot yet."

# Status policy for this record: no commit exists yet, so no area can claim
# host-verified or device-verified (both require a full 40-character revision).
# Everything measured so far is recorded under inputs/configuration/findings,
# and the concrete next measurement is under next_action.

[[area]]
id = "configuration"
status = "planned"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", ".gitignore", "local.toml.example", ".github/**"]
inputs = [
  "Format 2 device config derived from examples/device/board.toml, not from umi (format 1, standalone repository).",
  "SoC source is UniXNU-sm8250-common, pinned in feeds.toml at 3f6034d21b4e5f6830c76ca4da4fe3b6fc0125fa.",
  "OS profile ipados-17.7.11-21H461 exists in the UniXNU tree and is shared with umi.",
]
configuration = [
  "board.toml: schema_version = 2, board.name=cmi, board.soc=SM8250, board.soc_source=sm8250, board.kit=cmi.",
  "kernel.defconfig=cmi_defconfig; config_fragments and patch_series follow the template layer order arch, soc, os, device.",
  "Arrays replace inherited values, so every fragment and series entry is listed explicitly.",
]
procedure = [
  "Validated board.toml parses with tomllib: schema_version 2, dram_size 0x1fbb00000, payload.adt.chip_id 164 (hex).",
]
findings = [
  "payload.adt.chip_id is parsed as hexadecimal by scripts/unixnu/devicetree.py (int(str(chip_id), 16)); the template value 207 means 0x207, so cmi uses 164 = 0x164.",
  "board.example must stay unset: build and bootimg reject example repositories.",
  "scripts/unixnu/feeds.py resolve_soc() looks up the feed by (kind = \"soc\", name = board.soc_source) and raises \"soc source sm8250 needs a pinned commit\" when neither feeds.toml nor unixnu.lock carries one, so the pin is a build input, not documentation.",
  "The paths of this area also cover .github/**: scripts/porting-record.py check --base compares every non-Markdown path with the area patterns, and an unowned path fails with \"add its owner area and paths\".",
  ".github/workflows/porting-record.yml only calls UniXNU/UniXNU/.github/workflows/porting-record.yml@main, so the checks that run here are the upstream ones: python3 tools/scripts/porting-record.py check --device device --base <before>.",
  "board.toml [firmware] packages must list every PACKAGES_PATH root that the DSC chain includes, and [firmware.defines] carries the same research-build switch set the reference device umi passes (ENABLE_SECUREBOOT, MEMORY_PROTECTION, SHIP_MODE, DEVICE_MODEL, BUILDID_STRING); neither list is verified by a build yet.",
  "scripts/unixnu/util.py clang_bin() symlinks clang, lld-link, llvm-lib and llvm-rc into CLANG_BIN and raises \"not found on PATH\" for the first one missing, so the firmware job must provide unversioned names for all four; the workflow creates them from /usr/lib/llvm-*/bin when the distribution only ships versioned binaries.",
  "The firmware job runs fetch, tree and firmware as separate steps so a failure is attributable to source fetching, tree assembly or the EDK2 build without reading step logs.",
  "Actions logs cannot be downloaded without authentication even on a public repository (403), but check-run annotations can be read anonymously; the firmware job therefore emits the tail of its build logs with ::error:: so tools/gh_annotations.py can read the real failure without a token.",
]
completion = ["All source pins resolve; every selected component belongs to an area; status shows intended overrides and patch order."]
limits = [
  "The SoC repository is private, so the pinned commit cannot be fetched or reviewed from a host without credentials; the pin is only as good as that push.",
  "The record was checked by replaying the rules of scripts/porting-record.py locally (tools/check_record.py); the official Porting record workflow has not yet run on this revision.",
  "No UniXNU checkout exists on this host, so ./unixnu defconfig, fetch and status have never run against board.toml.",
]
next_action = ["Push this revision and confirm the Porting record check on the published commit, then run ./unixnu defconfig cmi_defconfig -D ../UniXNU-cmi in a real checkout."]
evidence = []

[[area]]
id = "firmware"
status = "planned"
components = ["DarwinBoot"]
paths = ["dts/**", "proprietary-files.txt", "package/**"]
inputs = [
  "Android boot image: header version 1, 4096-byte pages (Xiaomi SM8250 convention, confirmed in the stock header).",
  "Identity: qcom,msm-id 0x164 with SoC revision 0x00020001, qcom,board-id 0x24.",
  "Splash handoff region: cont_splash_region 0x9c000000 size 0x2300000, taken from the device device tree.",
  "Reference firmware package uefi-umi/Platforms/Xiaomi/umiPkg: Application/, Drivers/, Include/, Library/, umi.dec, umi.dsc, umi.fdf. Its DSC includes KonaPkg/KonaPkg.dsc.inc, so the SM8250 SoC layer is shared and only board PCDs and board drivers need changing.",
]
configuration = [
  "[[bootimg.dtb_node]] adds /reserved-memory/splash_region with label cont_splash_region for the stock bootloader.",
  "firmware.config=cmi, dsc=Platforms/Xiaomi/cmiPkg/cmi.dsc, fd=Build/cmiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd.",
]
procedure = ["Compile the board DTS with dtc -I dts -O dtb -i <soc dts dir>; apply bootimg.dtb_node with fdtput via ./unixnu bootimg."]
findings = [
  "cmiPkg is a line-for-line derivative of Platforms/Xiaomi/umiPkg: same !include KonaPkg/KonaPkg.dsc.inc, same library and driver list; only the SMBIOS PCDs, the stack base and the CCD flags differ.",
  "scripts/unixnu/firmware.py runs \"build -p <firmware.dsc> -a AARCH64 -b <target> -t CLANGPDB\", then requires the file named by firmware.fd to exist and to be exactly uefi_fd.size bytes from Resources/Configs/cmi.toml (0x00300000 here); a base value in the config is only passed to the build as -D FD_BASE.",
  "package.edk2_dir() raises \"no edk2 tree: pass --edk2 DIR (a Mu_Basecore checkout)\" when neither --edk2/UNIXNU_EDK2 nor a fetched refer edk2 module is present, and it then requires MdePkg/MdePkg.dec; Mu_Basecore is a submodule of uefi-umi, so a recursive checkout provides it.",
  "The DSC chain needs PACKAGES_PATH entries that resolve KonaPkg and QcomPkg (Silicon/Qualcomm), umiPkg INFs and the FLASH_DEFINITION cmiPkg/cmi.fdf (Platforms/Xiaomi) and Silicium packages (Silicon/Silicium); board.toml [firmware] packages lists those roots.",
  "The FD is written to <uefi>/Build/cmiPkg/<target>_CLANGPDB/FV/, not to the UniXNU output tree, because the DSC sets OUTPUT_DIRECTORY = Build/cmiPkg; a workflow that searches only out/ cannot find it.",
]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = [
  "No firmware build has run: clang, lld and make are absent on this host, and the workflow has never been triggered (the uefi fork reports zero workflow runs).",
  "Every statement above comes from reading scripts/unixnu/firmware.py, package.py and cli.py at UniXNU main, not from a build log.",
  "cmiPkg has no panel init and no backlight control yet; it reuses umiPkg panel-less GOP handoff, so the panel is whatever the stock bootloader leaves initialized.",
]
next_action = ["Dispatch the firmware workflow and read its first failure, then add cmi panel init and backlight to cmiPkg."]
evidence = []

[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["dts/sm8250.dtsi", "package/CpuFreq*"]
inputs = [
  "8 CPUs, compatible qcom,kryo, MPIDR affinity 0x0, 0x100, 0x200, 0x300, 0x400, 0x500, 0x600, 0x700 (device DT /cpus/cpu@N).",
  "GICD 0x17a00000 size 0x10000; GICR 0x17a60000 size 0x100000; redistributor-stride 0x20000 (device DT).",
  "PSCI method smc (device DT /psci).",
]
configuration = [
  "dts/sm8250.dtsi declares /cpus with timebase-frequency, /psci, and the GIC node with unixnu,adt-name = \"intc\" and phandle 1.",
  "Each CPU carries unixnu,cluster-type: cpu@0-300 are \"E\" and cpu@400-700 are \"P\", derived from the measured capacity-dmips-mhz values 0x1c0 versus 0x3fe-0x400.",
  "The interrupt-controller at 0x0b220000 is qcom,kona-pdc, not GICR, and is deliberately not exported yet.",
]
procedure = ["dtc compiles the tree; check_adt.py confirms 8 CPUs, timebase-frequency present, psci method valid, phandle unique."]
findings = [
  "timebase-frequency is absent from the vendor device tree; 19200000 is the SM8250 architectural timer constant and is unverified on hardware.",
  "#address-cells is not in the ADT property whitelist and was dropped from the GIC node.",
]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["No kernel build; timer frequency not measured on device."]
next_action = ["Read the arch timer frequency from a booted kernel log or a hardware measurement, then confirm or correct timebase-frequency."]
evidence = []

[[area]]
id = "memory"
status = "planned"
components = ["SoftwareAES"]
paths = ["dts/cmi.dts", "dts/sm8250.dtsi", "package/*Smmu*", "package/*Memory*"]
inputs = [
  "Three DRAM banks: 0x80000000+0x3bb00000, 0xc0000000+0xc0000000, 0x180000000+0x100000000.",
  "Bank sum 0x1fbb00000 (7.93 GiB); a 0x4500000 (69 MiB) hole sits at 0xbbb00000..0xc0000000.",
  "22 reserved-memory regions with base and size read from the device tree, including cont_splash_region, dfps_data_region and disp_rdump_region.",
]
configuration = [
  "cmi.dts declares exactly one enabled memory node with one reg range: base 0x80000000, size 0x1fbb00000.",
  "payload.dram_size in board.toml equals that size; the ADT generator rejects any difference.",
]
procedure = ["dtc compiles the tree; check_adt.py verifies one memory node, single range and exact dram_size equality."]
findings = [
  "The ADT generator requires one contiguous DRAM range, so the three banks are expressed as their sum rather than the 0x200000000 span; the hole is not declared as DRAM.",
  "reserved-memory no-map and reusable attributes are not set: they were not measured and affect whether the kernel may allocate those ranges.",
]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["no-map/reusable per region unknown; SMMU ownership and DMA bit width not inventoried."]
next_action = ["Read the no-map/reusable flags from the vendor device tree and set them per region before any XNU boot."]
evidence = []

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["drivers/ShengUfs", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*"]
inputs = [
  "UFS host: compatible qcom,ufshc, reg 0x1d84000+0x3000 and 0x1d90000+0x8000 (ICE), interrupt SPI 0x109 level-high, lanes-per-direction 2.",
  "userdata GPT entry: first_lba 0x2C0000, last_lba 0x3B4B7FA, lba_bytes 4096 (measured on this handset, 226.18 GiB).",
  "Device storage: sda 254.7 GB with super 8.5 GiB of dynamic partitions.",
]
configuration = [
  "dts/sm8250.dtsi defines ufs (label ufs, unixnu,adt-name ufshc, interrupt-parent <&intc>) and ufsphy (0x1d87000, qcom,ufs-phy-qmp-v4); both default to disabled.",
  "dts/cmi.dts enables them with &ufs { status = \"okay\"; } and &ufsphy { status = \"okay\"; }, the pattern used by UniXNU-sheng.",
  "board.toml [userdata] carries the measured geometry; [payload.adt] root_match_volume_uuid stays unset until a volume is chosen.",
]
procedure = ["GPT was read by dumping 8 sectors of /dev/block/sda and parsing the header on the host, because TWRP ships no sgdisk, parted or fdisk."]
findings = [
  "ShengUfs personality uses IONameMatch qcom,sm8550-ufshc while cmi reports qcom,ufshc, so the driver will not bind without a component-side change.",
  "ShengUfs is SM8550-specific (controller access, SMMU takeover, GccUfs clock states); SM8250 constants have not been compared.",
]
completion = ["Host: register, clock, link and SMMU facts match the board inventory. Reads: capacity, GPT and known blocks correct. Root: volume mounts and launchd starts."]
limits = ["No PHY, clock, reset, regulator or SMMU inventory; no component build.", "Candidate ShengUfs is not selected: it targets SM8550 and its personality does not match qcom,ufshc."]
next_action = ["Inventory SM8250 UFS PHY, GCC clock IDs, reset and SMMU stream, then compare against ShengUfs constants."]
evidence = []

[[area]]

  "Panel GPIOs: reset GPIO 12, TE GPIO 66; rails vci, vddio, dvdd, lab, ibb.",
  "DCS init, off and timing-switch sequences copied byte-exact from the device tree into dts/panel-j2-p2-1-38-0c-0a.dtsi.",
]
configuration = [

name: firmware

# 只编固件卷（不跑 kernel/payload/bootimg），目标是拿到 SILICIUM_UEFI.fd 先看点不点得亮。
#
# 为什么不是 build_uefi.py：那个脚本要求 Platforms/*/cmiPkg/DeviceBuild.py，而 umiPkg 里
# 就没有这个文件；而且它引用的 UniXNUPkg / DarwinBootPkg 不在 uefi-umi 仓里，在 UniXNU 树里。
# 所以走 UniXNU 的 firmware 步骤（scripts/unixnu/firmware.py）。
#
# 下面三处是对着 UniXNU 源码核过的、第一次跑必踩的点：
#   1. unixnu 在 UniXNU 检出的根目录里，不在 workspace 根 -> 每一步都 cd UniXNU；
#   2. firmware.py 通过 package.edk2_dir() 取 edk2，没有 --edk2 且 feeds 没 pin 时会直接
#      raise "no edk2 tree"；Mu_Basecore 是 uefi-umi 的子模块，所以传 --edk2 ../uefi-cmi/Mu_Basecore；
#   3. FD 落在 uefi 检出里（Build/<dsc 名>/<target>_CLANGPDB/FV/），不在 out/ 下。

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firmware.yml'
  workflow_dispatch:
    inputs:
      unixnu_ref:
        description: "UniXNU 的提交（40 位，留空用 env 默认）"
        required: false
      uefi_ref:
        description: "uefi 仓库的分支或提交（留空用 env 默认）"
        required: false
      uefi_repository:
        description: "uefi 仓库名（同属主；留空用 env 默认）"
        required: false

permissions:
  # contents: write 只用于把失败日志推到 ci-logs 分支；正常构建不写仓库。
  contents: write

env:
  # UniXNU main 在 2026-11-05 的提交；升级时改这一行。
  DEFAULT_UNIXNU_REF: 18155b4e441b68d54f841f08b7633f90822eb596
  DEFAULT_UEFI_REPO: uefi-umi
  DEFAULT_UEFI_REF: main

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 python3-pip python3-venv \
            clang lld llvm nasm acpica-tools uuid-dev \
            device-tree-compiler mtools bison flex pkg-config libssl-dev zlib1g-dev
          for t in nasm iasl dtc make python3; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; exit 1; }
          done
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'

      - name: CLANGPDB 工具自检
        # scripts/unixnu/util.py 的 clang_bin() 需要 clang、lld-link、llvm-lib、llvm-rc
        # 四个「无版本名」的可执行文件，缺一个就抛 "not found on PATH"。
        # Ubuntu 的 llvm 包只保证带版本号的名字，所以这里按需补软链，再打印版本备查。
        run: |
          for t in clang lld-link llvm-lib llvm-rc; do
            if ! command -v "$t" >/dev/null 2>&1; then
              src=$(ls /usr/lib/llvm-*/bin/$t 2>/dev/null | sort -V | tail -1)
              if [ -n "$src" ]; then
                sudo ln -sf "$src" "/usr/local/bin/$t"
                echo "补软链：/usr/local/bin/$t -> $src"
              fi
            fi
            if ! command -v "$t" >/dev/null 2>&1; then
              echo "缺少 CLANGPDB 工具：$t"
              echo "已安装的 llvm-* 二进制："
              ls /usr/lib/llvm-*/bin/ 2>/dev/null | sort -u | head -40
              exit 1
            fi
            echo "$t -> $(command -v "$t")"
          done
          clang --version | head -1
          lld-link --version | head -1

      - name: 检出 UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.unixnu_ref || env.DEFAULT_UNIXNU_REF }}
          path: UniXNU
          submodules: recursive

      - name: 检出 uefi（含 Mu_Basecore 子模块）
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.uefi_repository || env.DEFAULT_UEFI_REPO }}
          ref: ${{ inputs.uefi_ref || env.DEFAULT_UEFI_REF }}
          path: uefi-cmi
          submodules: recursive

      - name: 检出任一设备仓库（本仓库）
        uses: actions/checkout@v4
        with:
          path: UniXNU-cmi

      - name: 确认 cmiPkg 与非空子模块
        run: |
          test -f uefi-cmi/Platforms/Xiaomi/cmiPkg/cmi.dsc \
            || { echo "uefi-cmi/Platforms/Xiaomi/cmiPkg/cmi.dsc 不存在——cmiPkg 还没推上去"; exit 1; }
          test -f uefi-cmi/Mu_Basecore/MdePkg/MdePkg.dec \
            || { echo "Mu_Basecore 子模块为空——checkout 没带 recursive 或子模块不可访问"; exit 1; }
          ls uefi-cmi/Binaries >/dev/null 2>&1 \
            || echo "警告：uefi 检出里没有 Binaries 目录；若 cmiPkg 引用了 Binaries/umi 会在链接期失败"

      - name: 解析配置
        working-directory: UniXNU
        run: |
          ./unixnu defconfig cmi_defconfig -D ../UniXNU-cmi
          ./unixnu status --json -D ../UniXNU-cmi > ../status.json
          python3 -c "import json;s=json.load(open('../status.json'));print('output', s['output']);print('profiles', s['profiles']);print('modules', len(s['modules']))"

      - name: 预取源（edk2、组件、SoC）
        working-directory: UniXNU
        # prepare() 会在这里做：子模块、feeds 解析、git 浅取。单独一步是为了把
        # 「网络/可见性」和「EDK2 编译」分开归因，出问题一眼能看出是哪一类。
        run: ./unixnu fetch -D ../UniXNU-cmi

      - name: 汇出构建树
        working-directory: UniXNU
        run: ./unixnu tree -D ../UniXNU-cmi

      - name: 构建固件
        working-directory: UniXNU
        # firmware.py 内部顺序：uefi_config -> (BaseTools 若未编) -> EDK2 build -> 校验 FD 尺寸
        run: |
          ./unixnu firmware -D ../UniXNU-cmi \
            --uefi ../uefi-cmi \
            --edk2 ../uefi-cmi/Mu_Basecore

      - name: 失败时把日志尾巴发成注解
        if: failure()
        # Actions 日志下载需要认证，但 check-run 注解是公开可读的。
        # 所以失败时把 out/ 下日志的关键行打成 ::error::，从注解接口就能看到真实报错。
        run: |
          tmp=$(mktemp)
          {
            for f in $(find UniXNU/out -name '*.log' -type f 2>/dev/null | sort); do
              echo "== $f"
              tail -30 "$f"
            done
            for f in $(find uefi-cmi/Build -name '*.log' -type f 2>/dev/null | sort | head -5); do
              echo "== $f"
              tail -30 "$f"
            done
          } > "$tmp" 2>&1
          echo "---- 日志文件 ----"
          grep '^== ' "$tmp" || echo "(没有任何日志文件)"
          grep -iE 'error|not found|no such|failed|Traceback|raise |Exception' "$tmp" \
            | grep -viE 'zero errors|errorlevel 0|No errors' | tail -6 | cut -c1-500 > /tmp/errs.txt || true
          tail -4 "$tmp" | cut -c1-500 > /tmp/tail.txt || true
          echo "---- 关键错误 ----"
          cat /tmp/errs.txt || true
          echo "---- 尾部 ----"
          cat /tmp/tail.txt || true
          { cat /tmp/errs.txt; cat /tmp/tail.txt; } | head -10 | while IFS= read -r line; do
            if [ -n "$line" ]; then echo "::error::$line"; fi
          done

      - name: 失败时把完整日志推到 ci-logs 分支
        if: failure()
        # 注解只能带十几行；完整日志走 ci-logs 分支，任何人用
        # https://raw.githubusercontent.com/<owner>/<repo>/ci-logs/firmware.log 就能读。
        run: |
          work=$(mktemp -d)
          {
            echo "== run ${GITHUB_RUN_ID}  sha ${GITHUB_SHA}  attempt ${GITHUB_RUN_ATTEMPT}"
            for f in $(find UniXNU/out -name '*.log' -type f 2>/dev/null | sort); do
              echo
              echo "===== $f"
              tail -400 "$f"
            done
            echo
            echo "===== 目录清单"
            find UniXNU/out -maxdepth 6 -type d 2>/dev/null | head -40
            ls -l uefi-cmi/Build 2>/dev/null || echo "(没有 uefi-cmi/Build)"
          } > "$work/firmware.log" 2>&1
          wc -l "$work/firmware.log"
          cd "$work"
          git init -q .
          git checkout -q -b ci-logs
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git -c user.name="ci log" -c user.email="ci@localhost" commit -q -m "log run ${GITHUB_RUN_ID} (${GITHUB_SHA:0:7})"
          git push -q --force origin ci-logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 定位并上传 FD
        id: fd
        run: |
          fd=uefi-cmi/Build/cmiPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd
          if [ ! -f "$fd" ]; then
            echo "没找到 $fd，列出实际产物："
            find uefi-cmi/Build out -name '*.fd' -o -name '*.fv' 2>/dev/null | head -20
            exit 1
          fi
          ls -l "$fd"
          echo "path=$fd" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "$fd")" >> "$GITHUB_OUTPUT"

      - name: 校验 FD 尺寸与 uefi_fd
        working-directory: UniXNU
        run: |
          python3 - <<'PY'
          import os, tomllib
          cfg = tomllib.load(open('../uefi-cmi/Resources/Configs/cmi.toml', 'rb'))
          want = cfg['uefi_fd']['size']
          got = int(os.environ['FD_SIZE'])
          print(f'uefi_fd.size = {want:#x}  fd bytes = {got:#x}')
          assert got == want, 'FD 尺寸与 Resources/Configs/cmi.toml 的 [uefi_fd] size 不一致'
          PY
        env:
          FD_SIZE: ${{ steps.fd.outputs.size }}

      - name: 生成可启动的 boot.img
        # fastboot boot 要的是 Android boot 镜像（BootShim + gzip(FD) + 追加 DTB），
        # 不是裸 FD。scripts/unixnu/bootimg.py 负责编译 BootShim、打 DTB 节点、调 mkbootimg。
        working-directory: UniXNU
        run: |
          soc=$(ls -d out/feeds/*sm8250-common-* 2>/dev/null | head -1)
          echo "soc feed: $soc"
          dtc -I dts -O dtb -i "$soc/dts" -i ../UniXNU-cmi/dts -o ../cmi.dtb ../UniXNU-cmi/dts/cmi.dts
          ./unixnu bootimg -D ../UniXNU-cmi --uefi ../uefi-cmi \
            --fd ../uefi-cmi/Build/cmiPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd \
            --dtb ../cmi.dtb --ramdisk none -o ../boot.img
          ls -l ../boot.img ../boot.json
          cat ../boot.json

      - name: 把 FD 和 boot.img 推到 fd 分支（无需认证即可下载）
        # 制品下载接口需要认证；推到 fd 分支后
        # https://raw.githubusercontent.com/<owner>/<repo>/fd/boot.img 可直接下载。
        run: |
          work=$(mktemp -d)
          cp uefi-cmi/Build/cmiPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd "$work/SILICIUM_UEFI.fd"
          cp boot.img boot.json cmi.dtb "$work/"
          (cd "$work" && sha256sum SILICIUM_UEFI.fd boot.img cmi.dtb > SHA256SUMS && cat SHA256SUMS)
          cd "$work"
          git init -q .
          git checkout -q -b fd
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git -c user.name="ci fd" -c user.email="ci@localhost" commit -q -m "fd+boot ${GITHUB_SHA:0:7} run ${GITHUB_RUN_ID}"
          git push -q --force origin fd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: cmi-uefi-fd
          path: ${{ steps.fd.outputs.path }}
          if-no-files-found: error

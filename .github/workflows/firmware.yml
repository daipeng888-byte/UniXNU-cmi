name: firmware

# 只编固件卷（不跑 kernel/payload/bootimg），目标是先拿到 SILICIUM_UEFI.fd 看能不能点亮。
#
# 触发方式：
#   1) 推送本文件到 main 时自动触发（一次），这样只需要 push 就能开跑，不用点 Run workflow
#   2) 手动 Run workflow，可覆盖下面 env 里的默认值
#
# 为什么不是 build_uefi.py：那个脚本要求 Platforms/*/cmiPkg/DeviceBuild.py（umiPkg 里没有），
# 而且它引用的 UniXNUPkg / DarwinBootPkg 不在 uefi-umi 仓里，在 UniXNU 树里。
# 所以唯一可行的是 UniXNU 自己的 firmware 步骤。
#
# 未运行验证：第一次跑请看日志。EDK2 部分理论只需 clang/lld + nasm + iasl + dtc，
# 不需要 macOS，也不需要 setup-toolchain.py 里那套给 XNU 编译用的补丁版 clang。

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firmware.yml'
  workflow_dispatch:
    inputs:
      unixnu_ref:
        description: "UniXNU 的提交（留空用 env 默认）"
        required: false
      uefi_ref:
        description: "uefi 仓库的分支或提交（留空用 env 默认）"
        required: false
      uefi_repository:
        description: "uefi 仓库名（留空用 env 默认）"
        required: false

permissions:
  contents: read

env:
  # 固定版本：UniXNU main 在 2026-11-05 的提交
  DEFAULT_UNIXNU_REF: 18155b4e441b68d54f841f08b7633f90822eb596
  DEFAULT_UEFI_REPO: uefi-umi
  DEFAULT_UEFI_REF: main

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 python3-pip python3-venv \
            clang lld llvm nasm acpica-tools uuid-dev \
            device-tree-compiler mtools bison flex pkg-config libssl-dev zlib1g-dev
          for t in clang lld-link llvm-objcopy nasm iasl dtc make mformat python3; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; exit 1; }
          done

      - name: 解析目标仓库
        id: target
        env:
          IN_UNIXNU: ${{ inputs.unixnu_ref }}
          IN_UEFI_REF: ${{ inputs.uefi_ref }}
          IN_UEFI_REPO: ${{ inputs.uefi_repository }}
        run: |
          echo "unixnu_ref=${IN_UNIXNU:-$DEFAULT_UNIXNU_REF}" >> "$GITHUB_OUTPUT"
          echo "uefi_ref=${IN_UEFI_REF:-$DEFAULT_UEFI_REF}"     >> "$GITHUB_OUTPUT"
          echo "uefi_repo=${IN_UEFI_REPO:-$DEFAULT_UEFI_REPO}"   >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ steps.target.outputs.unixnu_ref }}
          path: UniXNU
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ steps.target.outputs.uefi_repo }}
          ref: ${{ steps.target.outputs.uefi_ref }}
          path: uefi-cmi
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          path: UniXNU-cmi

      - name: 确认 uefi 树里有 cmiPkg
        run: |
          test -f uefi-cmi/Platforms/Xiaomi/cmiPkg/cmi.dsc \
            || { echo "uefi-cmi/Platforms/Xiaomi/cmiPkg/cmi.dsc 不存在——cmiPkg 还没推到 uefi 仓库"; exit 1; }

      - name: 解析配置
        run: |
          ./unixnu defconfig cmi_defconfig -D ../UniXNU-cmi
          ./unixnu status --json -D ../UniXNU-cmi > status.json
          python3 - <<'PY'
          import json
          s = json.load(open("status.json"))
          print("output:", s.get("output"))
          print("profiles:", s.get("profiles"))
          print("components:", s.get("components"))
          PY

      - name: 构建固件
        run: ./unixnu firmware -D ../UniXNU-cmi --uefi ../uefi-cmi

      - name: 定位并上传 FD
        id: fd
        run: |
          fd=$(find out -name 'SILICIUM_UEFI.fd' -print -quit)
          [ -n "$fd" ] || { echo "SILICIUM_UEFI.fd not found"; find out -name '*.fd' 2>/dev/null | head; exit 1; }
          echo "path=$fd" >> "$GITHUB_OUTPUT"
          ls -l "$fd"

      - uses: actions/upload-artifact@v4
        with:
          name: cmi-uefi-fd
          path: ${{ steps.fd.outputs.path }}
          if-no-files-found: error
